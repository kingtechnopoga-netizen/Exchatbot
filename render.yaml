# Render Blueprint for ExChatBot v2
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: New + -> Blueprint -> select this repo.
#   3. Render reads this file and provisions the static site automatically.
services:
  - type: web
    name: exchatbot
    runtime: static
    buildCommand: "echo 'No build step required'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    autoDeploy: true

    # Single-page-app fallback (harmless for a one-page site).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Caching + security headers.
    # Long cache for static assets; no cache for HTML, manifest, and
    # the service worker so updates ship immediately.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()

      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Don't cache the entry document, the SW, or the manifest — these
      # control updates of everything else.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /script.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
